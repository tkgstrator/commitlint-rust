name: Integration
on:
  push:
    branches-ignore:
      - main
      - master
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# The literal prefix (not github.workflow) keeps this group distinct from the
# caller's group when invoked through workflow_call.
concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust (stable, minimal)
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
          rustup default stable
      - name: cargo fmt
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust (stable, minimal)
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal --component clippy --no-self-update
          rustup default stable
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  oracle:
    name: Commitlint oracle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.8.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6
      - name: Install pinned oracle
        working-directory: tests/oracle
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Oracle tests (committed fixtures are never regenerated)
        run: node --experimental-vm-modules --test tests/oracle/*.test.mjs

  commitlint:
    name: Commit messages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust (stable, minimal)
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Build commitlint
        run: cargo build -p commitlint-rust --locked
      - name: Lint commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          from=''
          to=''
          if [ "$REF_TYPE" = tag ]; then
            :
          elif [ "$EVENT_NAME" = pull_request ]; then
            from=$PR_BASE_SHA
            to=$PR_HEAD_SHA
          elif [ "$EVENT_NAME" = push ]; then
            to=$PUSH_SHA
            if [ "$PUSH_BEFORE_SHA" != "$zero" ]; then
              git cat-file -e "$PUSH_BEFORE_SHA^{commit}" \
                || { echo 'push base object missing; cannot verify the outgoing range' >&2; exit 1; }
              from=$PUSH_BEFORE_SHA
            else
              # First push of a branch: verify its entire divergence from default.
              from=$(git merge-base "origin/$BASE_BRANCH" HEAD) \
                || { echo 'first push base cannot be resolved' >&2; exit 1; }
            fi
          fi
          if [ -n "$from" ] && [ -n "$to" ] && [ "$(git rev-list --count "$from..$to")" -gt 0 ]; then
            echo "Linting $from..$to"
            target/debug/commitlint --from "$from" --to "$to"
          else
            echo 'Linting the current commit message'
            git show -s --format=%B HEAD | target/debug/commitlint
          fi

  native:
    name: Native ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust (stable, minimal)
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add "$TARGET"
      - name: Install musl toolchain
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          upper=$(printf '%s' "$TARGET" | tr 'a-z-' 'A-Z_')
          lower=$(printf '%s' "$TARGET" | tr '-' '_')
          {
            echo "CARGO_TARGET_${upper}_LINKER=musl-gcc"
            echo "CC_${lower}=musl-gcc"
          } >> "$GITHUB_ENV"
      - name: Test and build release (native, no cross flag)
        env:
          TARGET: ${{ matrix.target }}
        run: sh scripts/build.sh "$TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.target }}
          path: bin/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package release assets
    needs: [fmt, clippy, oracle, commitlint, native]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-*
          path: artifacts
      - name: Place native payloads
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl aarch64-apple-darwin x86_64-apple-darwin; do
            src="artifacts/native-$target"
            [ -d "$src" ] || { echo "missing artifact for $target" >&2; exit 1; }
            mkdir -p "bin/$target"
            for name in commitguard gh-commit-guard commitlint build-info; do
              [ -f "$src/$name" ] || { echo "missing $target/$name" >&2; exit 1; }
              cp "$src/$name" "bin/$target/$name"
            done
            chmod +x "bin/$target/commitguard" "bin/$target/gh-commit-guard" "bin/$target/commitlint"
          done
      - name: Packaging regression tests
        run: sh scripts/test-package-release.sh
      - name: Package all four targets
        run: sh scripts/package-release.sh x86_64-unknown-linux-musl aarch64-unknown-linux-musl aarch64-apple-darwin x86_64-apple-darwin
      - name: Read version
        id: version
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          [ -n "$version" ] || { echo 'workspace version missing' >&2; exit 1; }
          [ "$(find "dist/v$version" -type f | wc -l | tr -d ' ')" -eq 14 ] || { echo 'expected 13 payloads plus SHA256SUMS' >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: dist/v${{ steps.version.outputs.version }}
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: homebrew-formulae
          path: Formula/*.rb
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-provenance
          path: artifacts/native-*/build-info
          if-no-files-found: error
          retention-days: 7
