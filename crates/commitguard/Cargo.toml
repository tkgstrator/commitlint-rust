[package]
name = "commitguard"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Fresh human gh identity and attribution guard for Git commits"

[lib]
name = "commitguard"

[[bin]]
name = "commitguard"
path = "src/bin/commitguard.rs"

[[bin]]
name = "gh-commit-guard"
path = "src/bin/gh-commit-guard.rs"

[dependencies]
commitlint-rust = { path = "../commitlint-rust" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
regex = "=1.13.1"
libc = "=0.2.190"
sha2 = "=0.10.9"
