name: Deployment
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    # Manual runs are dry runs: they verify and build but never publish.

permissions:
  contents: read

concurrency:
  group: deployment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify release metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify version, tag and installer
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          [ -n "$version" ] || { echo 'workspace version missing' >&2; exit 1; }
          grep -Fqx "release_tag=v$version" install.sh \
            || { echo "install.sh release_tag must be v$version" >&2; exit 1; }
          if [ "$EVENT_NAME" = push ]; then
            [ "$REF_TYPE" = tag ] && [ "$REF_NAME" = "v$version" ] \
              || { echo "tag $REF_NAME must equal v$version" >&2; exit 1; }
            git merge-base --is-ancestor HEAD "origin/$BASE_BRANCH" \
              || { echo "release commit must be on $BASE_BRANCH" >&2; exit 1; }
          fi
          echo "Verified v$version"
      - name: Verify the release does not exist yet
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if err=$(gh release view "$TAG" --repo "$GH_REPO" 2>&1 >/dev/null); then
            echo "release $TAG already exists; refusing to overwrite" >&2
            exit 1
          fi
          case "$err" in
            *"release not found"*) echo "No release for $TAG yet" ;;
            *) echo "cannot determine release state: $err" >&2; exit 1 ;;
          esac

  ci:
    name: Integration
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/integration.yaml

  publish:
    name: Publish GitHub release
    needs: [verify, ci]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: release
      - name: Verify checksums
        working-directory: release
        run: |
          set -euo pipefail
          [ -f SHA256SUMS ] || { echo 'SHA256SUMS missing' >&2; exit 1; }
          sha256sum -c SHA256SUMS
          [ "$(find . -type f | wc -l | tr -d ' ')" -eq 14 ] || { echo 'expected 13 payloads plus SHA256SUMS' >&2; exit 1; }
          [ -z "$(find . -mindepth 1 -type d)" ] || { echo 'unexpected subdirectory' >&2; exit 1; }
      - name: Create release for the existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" release/* --repo "$GH_REPO" --verify-tag --title "$TAG" --generate-notes
