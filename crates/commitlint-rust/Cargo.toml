[package]
name = "commitlint-rust"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Message-only Conventional Commit linter with a fixed ASCII/LF policy"

[lib]
name = "commitlint_rust"

[[bin]]
name = "commitlint"
path = "src/main.rs"

[dependencies]
regex = "=1.13.1"
libc = "=0.2.190"
serde = "=1.0.229"
serde_json = "=1.0.151"
unicode-normalization = "=0.1.25"
ryu-js = "=1.0.3"
semver = "=1.0.28"
